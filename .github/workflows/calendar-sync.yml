name: Calendar sync regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calendar-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No installs or credentials: tests simulate the cloud, never modify it.
      - run: npm run check:calendar
