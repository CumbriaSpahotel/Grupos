<body class="bg-slate-50 min-h-screen">
    <dialog id="capasuite-login" class="rounded-xl p-6 shadow-xl" style="max-width:420px;width:90%">
        <form id="capasuite-login-form" class="flex flex-col gap-3">
            <h2 class="font-bold text-lg">Sesión de CapaSuite</h2>
            <p class="text-sm">Utiliza la misma cuenta de CapaSuite para sincronizar su calendario automáticamente en este navegador.</p>
            <label>Correo <input name="email" type="email" autocomplete="username" required class="border rounded p-2 w-full"></label>
            <label>Contraseña <input name="password" type="password" autocomplete="current-password" required class="border rounded p-2 w-full"></label>
            <p id="capasuite-login-error" role="alert" class="text-sm text-red-600"></p>
            <button type="submit" class="bg-indigo-600 text-white rounded p-2">Iniciar sesión</button>
            <button type="button" onclick="document.getElementById('capasuite-login-form').reset();document.getElementById('capasuite-login').close()">Cancelar</button>
        </form>
    </dialog>
  <div id="root"></div>

<script>
            document.getElementById('capasuite-login-form').addEventListener('submit', async function (event) {
                event.preventDefault();
                var form = event.currentTarget;
                var button = form.querySelector('button[type="submit"]');
                var error = document.getElementById('capasuite-login-error');
                button.disabled = true;
                error.textContent = '';
                try {
                    await window.CapaSuiteCalendarSync.signIn(form.elements.email.value.trim(), form.elements.password.value);
                    document.getElementById('capasuite-login').close();
                } catch (e) {
                    error.textContent = 'No se pudo iniciar sesión. Revisa la cuenta de CapaSuite y la conexión.';
                } finally {
                    form.elements.password.value = '';
                    button.disabled = false;
                }
            });


</script>
